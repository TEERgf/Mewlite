name: Build MewArch ISO

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed archiso git

      - uses: actions/checkout@v4

      - name: Build ISO
        run: |
          chmod +x iso/build-iso.sh install.sh memcheck.sh start.sh cute/*.sh lite/*.sh iso/airootfs/usr/local/bin/mewarch-install
          ./iso/build-iso.sh

      - name: Checksum
        run: cd out && sha256sum *.iso > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: mewarch-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          compression-level: 0

      - name: Attach to release (when you push a tag like v1.0)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/SHA256SUMS
